<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F172A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FB923C;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Decorative elements -->
  <circle cx="1100" cy="100" r="200" fill="#F97316" opacity="0.1"/>
  <circle cx="100" cy="530" r="150" fill="#F97316" opacity="0.1"/>
  
  <!-- Accent bar -->
  <rect x="0" y="610" width="1200" height="20" fill="url(#accentGrad)"/>
  
  <!-- Logo icon -->
  <g transform="translate(80, 200)">
    <rect width="120" height="120" rx="24" fill="url(#accentGrad)"/>
    <text x="60" y="82" font-family="Arial, sans-serif" font-size="70" font-weight="bold" fill="white" text-anchor="middle">F</text>
  </g>
  
  <!-- Main title -->
  <text x="230" y="260" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="white">Flash Info Afrique</text>
  
  <!-- Subtitle -->
  <text x="230" y="320" font-family="Arial, sans-serif" font-size="28" fill="#94A3B8">L'actualité économique et financière de la zone UEMOA</text>
  
  <!-- Tagline -->
  <text x="80" y="480" font-family="Arial, sans-serif" font-size="22" fill="#CBD5E1">Banque " Finance " Régulation " Marchés</text>
  
  <!-- Website URL -->
  <text x="80" y="560" font-family="Arial, sans-serif" font-size="20" fill="#F97316">flashinfoafrique.com</text>
</svg>

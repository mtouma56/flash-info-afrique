<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGradient)"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  
  <!-- Decorative circles -->
  <circle cx="650" cy="80" r="120" fill="rgba(255,255,255,0.03)"/>
  <circle cx="150" cy="380" r="100" fill="rgba(255,255,255,0.03)"/>
  
  <!-- Bank building icon -->
  <g transform="translate(300, 120)">
    <!-- Columns -->
    <rect x="30" y="100" width="30" height="120" fill="rgba(255,255,255,0.9)" rx="2"/>
    <rect x="85" y="100" width="30" height="120" fill="rgba(255,255,255,0.9)" rx="2"/>
    <rect x="140" y="100" width="30" height="120" fill="rgba(255,255,255,0.9)" rx="2"/>
    
    <!-- Roof triangle -->
    <polygon points="100,30 0,90 200,90" fill="rgba(255,255,255,0.95)"/>
    
    <!-- Base -->
    <rect x="0" y="220" width="200" height="20" fill="rgba(255,255,255,0.9)" rx="3"/>
    <rect x="-10" y="235" width="220" height="15" fill="rgba(255,255,255,0.8)" rx="2"/>
    
    <!-- Pediment detail -->
    <circle cx="100" cy="60" r="15" fill="rgba(30,58,138,0.8)" stroke="rgba(255,255,255,0.9)" stroke-width="3"/>
  </g>
  
  <!-- Currency symbols -->
  <text x="120" y="180" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="rgba(255,255,255,0.15)">¬</text>
  <text x="620" y="320" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="rgba(255,255,255,0.12)">$</text>
  <text x="680" y="180" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="rgba(255,255,255,0.1)">FCFA</text>
  
  <!-- Bottom label -->
  <rect x="0" y="400" width="800" height="50" fill="rgba(0,0,0,0.3)"/>
  <text x="400" y="432" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="white" text-anchor="middle">BANQUE &amp; FINANCE</text>
</svg>

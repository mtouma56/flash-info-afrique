<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EA580C;stop-opacity:1" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGradient)"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  
  <!-- Decorative circles -->
  <circle cx="700" cy="90" r="130" fill="rgba(255,255,255,0.03)"/>
  <circle cx="100" cy="360" r="100" fill="rgba(255,255,255,0.03)"/>
  
  <!-- Magnifying glass icon -->
  <g transform="translate(280, 100)">
    <!-- Glass circle -->
    <circle cx="100" cy="100" r="80" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="12"/>
    <circle cx="100" cy="100" r="60" fill="rgba(255,255,255,0.1)"/>
    
    <!-- Handle -->
    <line x1="160" y1="160" x2="220" y2="220" stroke="rgba(255,255,255,0.9)" stroke-width="16" stroke-linecap="round"/>
    
    <!-- Reflection -->
    <path d="M60,70 Q70,50 90,60" stroke="rgba(255,255,255,0.4)" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Document with chart inside magnifier -->
  <g transform="translate(320, 130)">
    <rect x="0" y="0" width="60" height="75" fill="rgba(255,255,255,0.2)" rx="4"/>
    <line x1="10" y1="15" x2="50" y2="15" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
    <line x1="10" y1="28" x2="50" y2="28" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
    <!-- Mini chart -->
    <polyline points="10,60 20,50 30,55 40,40 50,45" stroke="rgba(255,255,255,0.6)" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Data visualization elements -->
  <g transform="translate(100, 150)">
    <!-- Pie chart segment -->
    <circle cx="40" cy="40" r="35" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="15"/>
    <circle cx="40" cy="40" r="35" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="15" 
      stroke-dasharray="80 220" transform="rotate(-90 40 40)"/>
  </g>
  
  <g transform="translate(600, 140)">
    <!-- Bar chart -->
    <rect x="0" y="60" width="20" height="60" fill="rgba(255,255,255,0.2)" rx="2"/>
    <rect x="30" y="30" width="20" height="90" fill="rgba(255,255,255,0.25)" rx="2"/>
    <rect x="60" y="45" width="20" height="75" fill="rgba(255,255,255,0.2)" rx="2"/>
    <rect x="90" y="10" width="20" height="110" fill="rgba(255,255,255,0.3)" rx="2"/>
  </g>
  
  <!-- Light bulb / insight icon -->
  <g transform="translate(680, 280)">
    <ellipse cx="30" cy="30" rx="25" ry="28" fill="rgba(255,255,255,0.15)"/>
    <rect x="20" y="55" width="20" height="15" fill="rgba(255,255,255,0.15)" rx="2"/>
    <line x1="30" y1="10" x2="30" y2="-10" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <line x1="10" y1="20" x2="-5" y2="10" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <line x1="50" y1="20" x2="65" y2="10" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  </g>
  
  <!-- Bottom label -->
  <rect x="0" y="400" width="800" height="50" fill="rgba(0,0,0,0.3)"/>
  <text x="400" y="432" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="white" text-anchor="middle">ANALYSES &amp; DÉCRYPTAGES</text>
</svg>

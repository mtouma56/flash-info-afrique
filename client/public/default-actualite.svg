<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4F46E5;stop-opacity:1" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGradient)"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  
  <!-- Decorative circles -->
  <circle cx="680" cy="100" r="140" fill="rgba(255,255,255,0.03)"/>
  <circle cx="120" cy="350" r="120" fill="rgba(255,255,255,0.03)"/>
  
  <!-- Newspaper icon -->
  <g transform="translate(250, 80)">
    <!-- Main paper -->
    <rect x="0" y="0" width="300" height="220" fill="rgba(255,255,255,0.95)" rx="8"/>
    
    <!-- Header bar -->
    <rect x="0" y="0" width="300" height="40" fill="rgba(99,102,241,0.3)" rx="8"/>
    <rect x="0" y="30" width="300" height="10" fill="rgba(99,102,241,0.3)"/>
    
    <!-- Title lines -->
    <rect x="20" y="55" width="180" height="12" fill="rgba(99,102,241,0.6)" rx="2"/>
    <rect x="20" y="75" width="140" height="8" fill="rgba(99,102,241,0.3)" rx="2"/>
    
    <!-- Image placeholder -->
    <rect x="20" y="95" width="120" height="80" fill="rgba(99,102,241,0.15)" rx="4"/>
    <polygon points="50,155 80,125 110,155" fill="rgba(99,102,241,0.25)"/>
    <circle cx="55" cy="115" r="12" fill="rgba(99,102,241,0.2)"/>
    
    <!-- Text lines -->
    <rect x="155" y="95" width="125" height="6" fill="rgba(99,102,241,0.25)" rx="1"/>
    <rect x="155" y="108" width="125" height="6" fill="rgba(99,102,241,0.25)" rx="1"/>
    <rect x="155" y="121" width="100" height="6" fill="rgba(99,102,241,0.25)" rx="1"/>
    <rect x="155" y="134" width="125" height="6" fill="rgba(99,102,241,0.25)" rx="1"/>
    <rect x="155" y="147" width="80" height="6" fill="rgba(99,102,241,0.25)" rx="1"/>
    <rect x="155" y="160" width="110" height="6" fill="rgba(99,102,241,0.25)" rx="1"/>
    
    <!-- Bottom section -->
    <rect x="20" y="190" width="260" height="6" fill="rgba(99,102,241,0.2)" rx="1"/>
    <rect x="20" y="202" width="200" height="6" fill="rgba(99,102,241,0.2)" rx="1"/>
  </g>
  
  <!-- Globe/world icon -->
  <g transform="translate(100, 150)">
    <circle cx="40" cy="40" r="35" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="3"/>
    <ellipse cx="40" cy="40" rx="15" ry="35" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <line x1="5" y1="40" x2="75" y2="40" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <path d="M10,25 Q40,20 70,25" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
    <path d="M10,55 Q40,60 70,55" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  </g>
  
  <!-- Signal/broadcast waves -->
  <g transform="translate(620, 200)">
    <circle cx="30" cy="30" r="8" fill="rgba(255,255,255,0.3)"/>
    <path d="M15,15 Q5,30 15,45" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="3" stroke-linecap="round"/>
    <path d="M0,5 Q-15,30 0,55" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="3" stroke-linecap="round"/>
    <path d="M45,15 Q55,30 45,45" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="3" stroke-linecap="round"/>
    <path d="M60,5 Q75,30 60,55" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Flash/lightning bolt accent -->
  <g transform="translate(680, 100)">
    <polygon points="20,0 5,25 18,25 10,50 35,18 22,18" fill="rgba(255,255,255,0.2)"/>
  </g>
  
  <!-- Bottom label -->
  <rect x="0" y="400" width="800" height="50" fill="rgba(0,0,0,0.3)"/>
  <text x="400" y="432" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="white" text-anchor="middle">ACTUALITÉ</text>
</svg>

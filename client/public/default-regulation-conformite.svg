<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DC2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B91C1C;stop-opacity:1" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGradient)"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  
  <!-- Decorative circles -->
  <circle cx="700" cy="100" r="150" fill="rgba(255,255,255,0.03)"/>
  <circle cx="100" cy="350" r="120" fill="rgba(255,255,255,0.03)"/>
  
  <!-- Scale of justice icon -->
  <g transform="translate(300, 80)">
    <!-- Central pillar -->
    <rect x="90" y="50" width="20" height="200" fill="rgba(255,255,255,0.9)" rx="3"/>
    
    <!-- Top beam -->
    <rect x="20" y="40" width="160" height="15" fill="rgba(255,255,255,0.95)" rx="3"/>
    
    <!-- Left plate -->
    <ellipse cx="50" cy="180" rx="45" ry="12" fill="rgba(255,255,255,0.85)"/>
    <line x1="50" y1="55" x2="50" y2="168" stroke="rgba(255,255,255,0.9)" stroke-width="3"/>
    <line x1="20" y1="55" x2="80" y2="55" stroke="rgba(255,255,255,0.9)" stroke-width="3"/>
    
    <!-- Right plate -->
    <ellipse cx="150" cy="160" rx="45" ry="12" fill="rgba(255,255,255,0.85)"/>
    <line x1="150" y1="55" x2="150" y2="148" stroke="rgba(255,255,255,0.9)" stroke-width="3"/>
    <line x1="120" y1="55" x2="180" y2="55" stroke="rgba(255,255,255,0.9)" stroke-width="3"/>
    
    <!-- Base -->
    <rect x="60" y="250" width="80" height="12" fill="rgba(255,255,255,0.9)" rx="2"/>
    <rect x="45" y="258" width="110" height="8" fill="rgba(255,255,255,0.8)" rx="2"/>
  </g>
  
  <!-- Document/shield symbols -->
  <g transform="translate(100, 140)">
    <rect x="0" y="0" width="60" height="80" fill="rgba(255,255,255,0.1)" rx="5"/>
    <line x1="10" y1="20" x2="50" y2="20" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <line x1="10" y1="35" x2="50" y2="35" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <line x1="10" y1="50" x2="35" y2="50" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  </g>
  
  <g transform="translate(640, 180)">
    <path d="M30,0 L60,15 L60,45 C60,70 30,85 30,85 C30,85 0,70 0,45 L0,15 Z" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <path d="M20,40 L28,48 L45,28" stroke="rgba(255,255,255,0.3)" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Bottom label -->
  <rect x="0" y="400" width="800" height="50" fill="rgba(0,0,0,0.3)"/>
  <text x="400" y="432" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="white" text-anchor="middle">RÉGULATION &amp; CONFORMITÉ</text>
</svg>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Analytics script (only loaded if variables are configured) -->
    <!-- Vite will replace %VITE_ANALYTICS_ENDPOINT% and %VITE_ANALYTICS_WEBSITE_ID% at build time -->
    <!-- If variables are not set, the script will not load (empty src) -->
    <script
      defer
      data-analytics-endpoint="%VITE_ANALYTICS_ENDPOINT%"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"
      id="analytics-loader">
      (function() {
        const script = document.getElementById('analytics-loader');
        const endpoint = script?.getAttribute('data-analytics-endpoint');
        const websiteId = script?.getAttribute('data-website-id');
        
        // Only load if both variables are set and not placeholders
        if (endpoint && websiteId && 
            !endpoint.includes('%') && !websiteId.includes('%') &&
            endpoint.trim() !== '' && websiteId.trim() !== '') {
          const analyticsScript = document.createElement('script');
          analyticsScript.defer = true;
          analyticsScript.src = endpoint + '/umami';
          analyticsScript.setAttribute('data-website-id', websiteId);
          document.head.appendChild(analyticsScript);
        }
        // Remove the loader script
        script?.remove();
      })();
    </script>
  </body>
